services:
  postgres:
    image: postgres:latest
    container_name: photo-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - photo_pgdata:/var/lib/postgresql

volumes:
  photo_pgdata: